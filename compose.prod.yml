# Production stack. Unlike docker-compose.yml this builds nothing and mounts no
# source: every service runs a prebuilt image from GHCR, pinned by IMAGE_TAG.
# Deployed to /opt/app by the `app` role in the app-infra repo.
services:
  db:
    container_name: chatapp-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No `ports:` on purpose. Publishing 5432 would expose Postgres to the
    # internet: Docker writes its own iptables rules and bypasses UFW entirely.
    # backend reaches it over chatapp-net as `db`.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatapp-net

  backend:
    container_name: chatapp-backend
    image: ${REGISTRY}/chatapp-backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      AVATAR_DIR: /app/media/avatars
    volumes:
      - avatars:/app/media/avatars
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chatapp-net

  frontend:
    container_name: chatapp-frontend
    image: ${REGISTRY}/chatapp-frontend:${IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatapp-net

  gateway:
    container_name: chatapp-gateway
    image: ${REGISTRY}/chatapp-gateway:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${GATEWAY_HTTP_PORT}:80"
      - "${GATEWAY_HTTPS_PORT}:443"
    # nginx.conf is baked into the image. The only thing worth persisting is the
    # self-signed cert entrypoint.sh generates, or every deploy issues a new one.
    volumes:
      - gateway-certs:/etc/nginx/conf
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatapp-net

volumes:
  db-data:
    name: chatapp-db-data
  avatars:
    name: chatapp-avatars
  gateway-certs:
    name: chatapp-gateway-certs

networks:
  chatapp-net:
    name: chatapp-network
    driver: bridge
