services:
  db:
    container_name: chatapp-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatapp-net

  backend:
    container_name: chatapp-backend
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chatapp-net

  frontend:
    container_name: chatapp-frontend
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatapp-net

  gateway:
    container_name: chatapp-gateway
    build:
      context: ./gateway
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${GATEWAY_HTTP_PORT}:80"
      - "${GATEWAY_HTTPS_PORT}:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/certs:/etc/nginx/certs
      - ./gateway/gen-cert.sh:/usr/local/bin/gen-cert.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatapp-net

volumes:
  db-data:
    name: chatapp-db-data

networks:
  chatapp-net:
    name: chatapp-network
    driver: bridge